# ALL MDM: gera a imagem Docker e publica em ghcr.io/allexandercaneschi/all-mdm.
#
# - Push na branch "all-branding": publica a tag "edge" (para testar).
# - Tag v<versão>-all.<n> (ex.: v5.41.1-all.1): publica essa versão e "latest".
name: Build ALL MDM image

on:
  push:
    branches: [all-branding]
    tags: ['v*-all.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/all-mdm
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
