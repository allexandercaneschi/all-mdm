# ALL MDM: gera a imagem Docker e publica em ghcr.io/allexandercaneschi/all-mdm.
#
# A versão da ALL fica no arquivo ALL_VERSION (formato X.Y.Z, ex.: 1.0.0).
# - Todo push na branch "all/main" publica a tag "main" (acompanha a branch, para testar).
# - Se a versão do ALL_VERSION ainda não foi publicada, publica também "<versão>" e "latest"
#   e cria a tag v<versão> no repositório. Para lançar uma versão nova: altere ALL_VERSION e faça push.
name: Build ALL MDM image

on:
  push:
    branches: [all/main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: ver
        run: |
          VERSION=$(tr -d ' \r\n' < ALL_VERSION)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ALL_VERSION deve ter o formato X.Y.Z (ex.: 1.0.0). Encontrado: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/all-mdm
          tags: |
            type=raw,value=main
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.release == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publicar no Releases
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ALL MDM v${{ steps.ver.outputs.version }}
          body: |
            Imagem Docker **ALL MDM** v${{ steps.ver.outputs.version }}.

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/all-mdm:${{ steps.ver.outputs.version }}
            ```

            No Portainer: `IMAGE_TAG=${{ steps.ver.outputs.version }}`.
            Painel e agente desta versão: releases v${{ steps.ver.outputs.version }} dos repositórios all-mdm-server e all-mdm-android.
          generate_release_notes: true
