# ALL MDM — stack para Docker Compose ou Portainer (Stacks → Add stack).
#
# Ambiente da ALL Tecnologias:
# - PostgreSQL externo (VM 172.16.0.242), sem container de banco nesta stack
# - TLS terminado no proxy reverso: o Tomcat responde em HTTP na porta 8800 do host
# - Porta 31000 (MQTT, push para os celulares) deve ser liberada/encaminhada direto,
#   sem passar pelo proxy HTTP
#
# Copie .env.example para .env (ou cadastre as variáveis no Portainer) antes de subir.

services:
  hmdm:
    image: ghcr.io/allexandercaneschi/all-mdm:${IMAGE_TAG:-latest}
    container_name: all-mdm
    restart: unless-stopped
    ports:
      - "8800:8080"
      - "31000:31000"
    volumes:
      - work:/usr/local/tomcat/work
      - config:/usr/local/tomcat/conf/Catalina/localhost
      - webapps:/usr/local/tomcat/webapps
    environment:
      SQL_HOST: ${SQL_HOST}
      SQL_PORT: ${SQL_PORT:-5432}
      SQL_BASE: ${SQL_BASE}
      SQL_USER: ${SQL_USER}
      SQL_PASS: ${SQL_PASS}
      BASE_DOMAIN: ${BASE_DOMAIN}
      PROTOCOL: http
      PUBLIC_PROTOCOL: https
      PROXY_ADDRESSES: ${PROXY_ADDRESSES:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SHARED_SECRET: ${SHARED_SECRET}
      INSTALL_LANGUAGE: en
      FORCE_RECONFIGURE: ${FORCE_RECONFIGURE:-}

volumes:
  work:
  config:
  webapps:
